<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja</title>
<script>try{var t=localStorage.getItem('theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c1:#3b2418;--c2:#f29bb0;--paper:#fff7f4;
--bg:color-mix(in srgb,var(--c2) 11%,#fffdfc);
--ink:color-mix(in srgb,var(--c1) 82%,#000);
--muted:color-mix(in srgb,var(--ink) 68%,var(--bg));
--line:color-mix(in srgb,var(--ink) 18%,var(--bg));
--err:#b3261e;--drawer:#fff;--btn:var(--c1);--btn-ink:var(--paper);
--display:Caprasimo,'Cooper Black',Georgia,serif;color-scheme:light}
[data-theme=dark]{--err:#ff9a90;--bg:#1a1315;--ink:#f4ece8;--muted:#b8a9a2;--line:#3d3135;--drawer:#241b1e;--btn:var(--c2);--btn-ink:var(--c1);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:400 1.0625rem/1.6 Karla,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2{font-family:var(--display);font-weight:400;line-height:1;margin:0}
h2{font-size:clamp(2rem,4vw,2.8rem);margin-bottom:1.4rem}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.band :focus-visible{outline-color:var(--paper)}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem}
.brand{display:flex;align-items:center;gap:.7rem;font:400 1.4rem var(--display);color:var(--ink);text-decoration:none}
.brand img{width:40px;height:40px;object-fit:contain;border-radius:8px}
.logo-ph{width:40px;height:40px;border-radius:10px;background:var(--c2);display:grid;place-items:center}
.logo-ph svg{width:72%;height:auto}
nav{margin-left:auto;display:flex;gap:1.4rem;align-items:center}
nav>a{text-decoration:none;font-weight:500}nav>a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--c2)}
.themebtn{background:none;border:0;color:var(--ink);width:40px;height:40px;border-radius:8px;display:grid;place-items:center}
.themebtn:hover{background:var(--line)}
.cartbtn{white-space:nowrap;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:.55rem 1rem;font-weight:700}

.hero{max-width:1100px;margin:0 auto;padding:3.5rem 1.2rem 4rem;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(3rem,10vw,7.5rem);line-height:.92;overflow-wrap:anywhere}
.hero p{font-size:1.3rem;line-height:1.5;max-width:28ch;margin:1.4rem 0 2rem}
.cta{display:inline-block;background:var(--btn);color:var(--btn-ink);padding:.85rem 1.6rem;border:0;border-radius:10px;font-weight:700;text-decoration:none}
.cta:hover{filter:brightness(1.12)}
.patch{aspect-ratio:1;border-radius:26%;background:var(--c2) center/cover;transform:rotate(3deg);outline:3px dashed var(--bg);outline-offset:-14px;display:grid;place-items:center}
.patch svg{width:90%;height:auto;overflow:visible}
.patch.img svg{display:none}
.steam path{stroke-dasharray:1;animation:draw 1.1s .3s ease-out backwards}
.steam path+path{animation-delay:.6s}
@keyframes draw{from{stroke-dashoffset:1}}

section{max-width:1100px;margin:0 auto;padding:3rem 1.2rem 4.5rem}
.filters{display:flex;gap:1.4rem;flex-wrap:wrap;margin-bottom:2rem}
.filters button{background:none;border:0;border-bottom:4px solid transparent;padding:.15rem 0;color:var(--ink);font-weight:500}
.filters button:hover{border-color:var(--line)}
.filters button.on{border-color:var(--c2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2.6rem 1.6rem}
.item{display:flex;flex-direction:column}
.pic{--t:color-mix(in srgb,var(--c2) 45%,#fff);position:relative;aspect-ratio:1;border-radius:14px;background:var(--t);display:grid;place-items:center;overflow:hidden}
.item:nth-child(3n+2) .pic{--t:color-mix(in srgb,var(--c2) 22%,#fff)}
.item:nth-child(3n) .pic{--t:color-mix(in srgb,var(--c1) 14%,#fff)}
.pic svg{width:58%;height:auto}
.pic img{width:100%;height:100%;object-fit:cover}
.price{position:absolute;left:.7rem;bottom:.7rem;background:var(--c1);color:var(--paper);font:400 1.05rem/1 var(--display);padding:.5rem .8rem;border-radius:6px;transform:rotate(-4deg);outline:2px dashed color-mix(in srgb,var(--paper) 60%,transparent);outline-offset:-4px}
.item h3{font:700 1.15rem/1.25 Karla,sans-serif;margin:.9rem 0 .25rem}
.item p{margin:0 0 1rem;color:var(--muted);font-size:.98rem}
.add{margin-top:auto;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:.55rem;font-weight:700}
.add:hover{background:var(--ink);color:var(--bg)}

.band{background:var(--c1);color:var(--paper)}
.band section{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:3rem;padding:4.5rem 1.2rem}
.band #about{font-size:1.25rem;line-height:1.65;white-space:pre-line;max-width:46ch;margin:0}
#contact:empty{display:none}
#contact h2{font-size:1.6rem;margin-bottom:.8rem}
dl{margin:0}dl div{display:grid;grid-template-columns:6.5rem 1fr;gap:1rem;padding:.7rem 0;border-top:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
dt{opacity:.75}dd{margin:0;overflow-wrap:anywhere}
footer{background:var(--c1);color:var(--paper);border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent)}
footer div{max-width:1100px;margin:auto;padding:1.3rem 1.2rem;font-size:.95rem}

aside{position:fixed;right:0;top:0;height:100%;width:min(400px,100%);background:var(--drawer);color:var(--ink);transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:9;padding:1.4rem;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0004}
aside.open{transform:none;visibility:visible;transition-delay:0s}
aside h2{font-size:1.8rem;margin-bottom:1rem}
#items{flex:1;overflow:auto}
.row{display:flex;justify-content:space-between;gap:.8rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.row small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:.6rem}
.qty button{border:2px solid var(--ink);background:none;color:var(--ink);border-radius:8px;width:32px;height:32px;line-height:1;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;font:400 1.6rem var(--display);margin:1rem 0}
#checkout label{display:block;font-weight:500;margin-top:.6rem}
#checkout input{display:block;width:100%;margin-top:.2rem;padding:.6rem .7rem;border:2px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
#buy{width:100%;cursor:pointer;margin-top:1rem}#buy:disabled{opacity:.6;cursor:wait}
#cerr{color:var(--err);margin:.6rem 0 0;min-height:1.2em}
#done{background:var(--bg);border-radius:10px;padding:1rem;margin-top:1rem}#done p{margin:0 0 .8rem}#done a{display:block;text-align:center}
#close{margin-top:.8rem;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
body.noprice .price{display:none}
body.vitrine .cartbtn,body.vitrine .add,body.vitrine aside{display:none!important}

@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:2rem;gap:2rem}.patch{max-width:300px}.band section{grid-template-columns:1fr;gap:2.5rem}nav>a{display:none}.brand{font-size:1.15rem;min-width:0}nav{gap:.6rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="in"><a class="brand" href="#"><span id="logo"></span><span id="n1"></span></a>
<nav><a href="#produtos">Produtos</a><a href="#sobre">Sobre</a><button class="themebtn" id="theme" aria-label="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor"/></svg></button><button class="cartbtn" id="open">Carrinho (<span id="cnt">0</span>)</button></nav></div></header>
<main>
<div class="hero"><div><h1 id="n2"></h1><p id="slogan"></p><a class="cta" href="#produtos">Ver produtos</a></div>
<div class="patch" id="hero" role="img" aria-label="Xícara com orelhas de ursinho"><svg viewBox="0 0 200 200" aria-hidden="true">
<g class="steam" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"><path pathLength="1" d="M86 80q-8-10 0-20t0-20"/><path pathLength="1" d="M101 80q8-10 0-20t0-20"/></g>
<circle cx="66" cy="84" r="17" fill="var(--c1)"/><circle cx="120" cy="84" r="17" fill="var(--c1)"/>
<circle cx="66" cy="84" r="8" fill="#fff7f4" opacity=".85"/><circle cx="120" cy="84" r="8" fill="#fff7f4" opacity=".85"/>
<path d="M136 106h6a22 22 0 010 44h-6" fill="none" stroke="var(--c1)" stroke-width="12"/>
<rect x="50" y="86" width="86" height="84" rx="18" fill="var(--c1)"/>
<path d="M93 92v14" stroke="#fff7f4" stroke-width="2.4" stroke-dasharray="3 4" stroke-linecap="round"/>
<circle cx="80" cy="118" r="4.5" fill="#fff7f4"/><circle cx="106" cy="118" r="4.5" fill="#fff7f4"/>
<ellipse cx="93" cy="140" rx="17" ry="13" fill="#fff7f4"/><ellipse cx="93" cy="133" rx="6" ry="4.2" fill="var(--c1)"/>
<path d="M93 137v6M85 146q8 6 16 0" fill="none" stroke="var(--c1)" stroke-width="2.4" stroke-linecap="round"/></svg></div></div>
<section id="produtos"><h2>Produtos</h2><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section>
<div class="band" id="sobre"><section><div><h2>Sobre nós</h2><p id="about"></p></div><div id="contact"></div></section></div>
</main>
<footer><div id="foot"></div></footer>
<aside id="cart" aria-label="Carrinho"><h2>Seu carrinho</h2><div id="items"></div>
<div id="checkout" hidden><p class="total"><span>Total</span><span id="total"></span></p>
<label for="cname">Seu nome</label><input id="cname" autocomplete="name" maxlength="80">
<label for="ccontact">WhatsApp ou e-mail</label><input id="ccontact" autocomplete="off" maxlength="80">
<button class="cta" id="buy">Finalizar pedido</button></div>
<p id="cerr" role="alert"></p><div id="done" role="status" hidden></div>
<button id="close">Continuar comprando</button></aside>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ART={
bear:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="30" cy="33" r="10" fill="var(--c1)"/><circle cx="70" cy="33" r="10" fill="var(--c1)"/><circle cx="30" cy="33" r="5" fill="var(--c2)"/><circle cx="70" cy="33" r="5" fill="var(--c2)"/><circle cx="50" cy="56" r="27" fill="var(--c1)"/><path d="M50 31v11" stroke="var(--paper)" stroke-width="1.6" stroke-dasharray="2 2.5" stroke-linecap="round"/><ellipse cx="50" cy="66" rx="12" ry="9" fill="var(--paper)"/><ellipse cx="50" cy="61" rx="4.5" ry="3.2" fill="var(--c1)"/><circle cx="40" cy="50" r="2.8" fill="var(--paper)"/><circle cx="60" cy="50" r="2.8" fill="var(--paper)"/><path d="M50 64v4M44 70q6 4 12 0" fill="none" stroke="var(--c1)" stroke-width="1.6" stroke-linecap="round"/></svg>',
mug:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M36 30q-5 6 0 12M50 26q-5 6 0 12M64 30q-5 6 0 12" fill="none" stroke="var(--c1)" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/><path d="M68 54h4a10 10 0 010 20h-4" fill="none" stroke="var(--c1)" stroke-width="6"/><rect x="24" y="44" width="44" height="40" rx="9" fill="var(--c1)"/><rect x="24" y="44" width="44" height="7" rx="3.5" fill="var(--paper)" opacity=".85"/></svg>',
bag:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M28 24h44l3 8v48a4 4 0 01-4 4H29a4 4 0 01-4-4V32z" fill="var(--c1)"/><path d="M25 32h50" stroke="var(--paper)" stroke-opacity=".6" stroke-width="2"/><rect x="34" y="44" width="32" height="28" rx="3" fill="var(--paper)"/><ellipse cx="50" cy="58" rx="7" ry="10" transform="rotate(35 50 58)" fill="var(--c1)"/><path d="M55 51Q51 59 45 65" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round"/></svg>',
tag:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M34 20h32l6 8v52a4 4 0 01-4 4H32a4 4 0 01-4-4V28z" fill="var(--c1)"/><circle cx="50" cy="33" r="4.5" fill="var(--t,var(--c2))"/><path d="M38 50h24M38 60h24M38 70h14" stroke="var(--paper)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/></svg>'};
const kind=c=>/caf[eé]/i.test(c)?'bag':/pel[uú]cia/i.test(c)?'bear':/caneca|x[ií]cara|acess|copo|garrafa/i.test(c)?'mug':'tag';
let site={},prods=[],cat='Todos',cart={};
try{cart=JSON.parse(localStorage.getItem('cart')||'{}')}catch{}
const persist=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch{}};
function renderSite(){document.title=site.name;document.body.classList.toggle('vitrine',site.shop==='0');document.body.classList.toggle('noprice',site.prices==='0');
const rs=document.documentElement.style;rs.setProperty('--c1',site.color1);rs.setProperty('--c2',site.color2);
$('#logo').innerHTML=site.logo?`<img src="${esc(site.logo)}" alt="">`:`<span class="logo-ph">${ART.mug}</span>`;
$('#n1').textContent=$('#n2').textContent=site.name;$('#slogan').textContent=site.slogan;$('#about').textContent=site.about;
if(site.hero){const h=$('#hero');h.style.backgroundImage=`url("${site.hero}")`;h.classList.add('img');h.setAttribute('aria-label','Imagem de capa')}
const l=[],w=(site.whatsapp||'').replace(/\D/g,'');
if(site.address)l.push(['Endereço',esc(site.address)]);
if(site.email)l.push(['E-mail',`<a href="mailto:${esc(site.email)}">${esc(site.email)}</a>`]);
if(site.whatsapp)l.push(['WhatsApp',w?`<a href="https://wa.me/${w}">${esc(site.whatsapp)}</a>`:esc(site.whatsapp)]);
if(site.instagram)l.push(['Instagram',esc(site.instagram)]);
$('#contact').innerHTML=l.length?'<h2>Contato</h2><dl>'+l.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')+'</dl>':'';
$('#foot').textContent=`© ${new Date().getFullYear()} ${site.name}`}
function renderProds(){const cats=['Todos',...new Set(prods.map(p=>p.category))];
$('#filters').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('#grid').innerHTML=prods.filter(p=>cat==='Todos'||p.category===cat).map(p=>`<article class="item"><div class="pic">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:ART[kind(p.category)]}<span class="price">${brl(p.price)}</span></div>
<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><button class="add" data-id="${esc(p.id)}">Adicionar ao carrinho</button></article>`).join('')||'<p>Nenhum produto por aqui ainda.</p>'}
function renderCart(){const ids=Object.keys(cart).filter(id=>prods.some(p=>p.id===id));let t=0,n=0;
$('#items').innerHTML=ids.map(id=>{const p=prods.find(x=>x.id===id),q=cart[id];t+=p.price*q;n+=q;
return `<div class="row"><span>${esc(p.name)}<br><small>${brl(p.price)}</small></span><span class="qty"><button data-m="${esc(id)}" aria-label="Menos">−</button><b>${q}</b><button data-p="${esc(id)}" aria-label="Mais">+</button></span></div>`}).join('')||'<p>Seu carrinho está vazio. Escolha um produto para começar.</p>';
$('#cnt').textContent=n;$('#total').textContent=brl(t);$('#checkout').hidden=!n}
document.addEventListener('click',e=>{const t=e.target.closest('button')||e.target;
if(t.dataset.c){cat=t.dataset.c;renderProds()}
if(t.classList.contains('add')||t.dataset.p){const id=t.dataset.id||t.dataset.p;cart[id]=(cart[id]||0)+1;persist();renderCart();if(t.classList.contains('add')){$('#done').hidden=true;$('#cerr').textContent='';$('#cart').classList.add('open')}}
if(t.dataset.m){const id=t.dataset.m;if(--cart[id]<=0)delete cart[id];persist();renderCart()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#cart').classList.remove('open')});
const setT=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch{}};
$('#theme').onclick=()=>setT(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#open').onclick=()=>$('#cart').classList.add('open');$('#close').onclick=()=>$('#cart').classList.remove('open');
$('#buy').onclick=async()=>{const items=Object.keys(cart).filter(id=>prods.some(p=>p.id===id)).map(id=>({id,qty:cart[id]}));if(!items.length)return;
const name=$('#cname').value.trim(),contact=$('#ccontact').value.trim(),err=$('#cerr');err.textContent='';
if(!name||!contact){err.textContent='Preencha seu nome e um contato (WhatsApp ou e-mail).';(name?$('#ccontact'):$('#cname')).focus();return}
$('#buy').disabled=true;
try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,contact,items})}),o=await r.json();
if(!r.ok)throw new Error(o.error||'Não foi possível enviar o pedido.');
cart={};persist();renderCart();$('#cname').value=$('#ccontact').value='';
const w=(site.whatsapp||'').replace(/\D/g,''),msg=`Olá! Fiz o pedido nº ${o.number}:\n`+o.items.map(i=>`${i.qty}x ${i.name}`).join('\n')+`\nTotal: ${brl(o.total)}`;
$('#done').innerHTML=`<p><b>Pedido nº ${o.number} registrado.</b> ${w?'Combine o pagamento e a entrega pelo WhatsApp.':'A loja vai entrar em contato pelo que você informou.'}</p>`+(w?`<a class="cta" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}">Abrir WhatsApp</a>`:'');
$('#done').hidden=false}
catch(x){err.textContent=x.message}finally{$('#buy').disabled=false}};
Promise.all([fetch('/api/site').then(r=>r.json()),fetch('/api/products').then(r=>r.json())]).then(([s,p])=>{site=s;prods=p;renderSite();renderProds();renderCart()});
</script></body></html>
